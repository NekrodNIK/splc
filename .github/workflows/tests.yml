name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        grammar: [1]
        stage: ["lexer"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate JSON schemas
        run: |
          #pip install jsonschema
          #python test/validate_schemas.py

      - name: Install test harness dependency
        run: pip install pytest

      - name: Set-up OCaml
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: 5

      - name: Install splc dependencies
        run: |
          opam install . --deps-only

      - name: Build your compiler
        run:
          opam exec -- dune build

      - name: Run tests for grammar ${{ matrix.grammar }}
        run: python3 test/run_tests.py test --grammar ${{ matrix.grammar }} --stage ${{ matrix.stage }} --no-build
